<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        {% load static %}
        <!-- Critical CSS inline for faster rendering -->
        <style>
            article h1,aside h1,nav h1,section h1{font-size:1.875rem;line-height:2.25rem;font-weight:700}
            article h2,aside h2,nav h2,section h2{font-size:1.5rem;line-height:2rem;font-weight:600}
            article h3,aside h3,nav h3,section h3{font-size:1.25rem;line-height:1.75rem;font-weight:600}
        </style>
        <!-- Non-critical CSS loaded asynchronously -->
        <link rel="preload" href="{% static 'css/output.css' %}" as="style" onload="this.onload=null;this.rel='stylesheet'">
        <noscript><link rel="stylesheet" href="{% static 'css/output.css' %}"></noscript>
        <!-- SEO Meta -->
        <meta name="description"
              content="{% block meta_description %}Read free manga online - updated daily.{% endblock meta_description %}">
        <meta name="keywords"
              content="{% block meta_keywords %}free manga, manga reader, read manga online{% endblock meta_keywords %}">
        <meta name="author" content="MangaFoxy">
        <meta name="language" content="English">
        <meta name="revisit-after" content="1 days">
        <link rel="icon" type="image/x-icon" href="{% static 'images/mangafox_favicon.ico' %}">
        <link rel="canonical" href="{% block canonical_url %}{{ request.build_absolute_uri }}{% endblock canonical_url %}">
        <!-- Robots -->
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website">
        <meta property="og:url" content="{% block og_url %}{{ request.build_absolute_uri }}{% endblock og_url %}">
        <meta property="og:site_name" content="MangaFoxy">
        <meta property="og:locale" content="en_US">
        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:site" content="@MangaFoxy">
        <title>
            {% block title %}
                MangaFoxy
            {% endblock title %}
        </title>
        <!-- PWA Support -->
        <link rel="manifest" href="{% url 'manifest' %}">
        <meta name="theme-color" content="#000000">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black">
        <meta name="apple-mobile-web-app-title" content="MangaFoxy">
        <meta name="monetag" content="e1222cc5da8e7b88e6457df210608520">
        <link rel="apple-touch-icon" href="{% static 'images/mangafox_favicon.ico' %}">
        <!-- Preconnect to external domains -->
        <link rel="dns-prefetch" href="https://www.googletagmanager.com">
        <link rel="dns-prefetch" href="https://www.google-analytics.com">
        {% block extra_head %}
        {% endblock extra_head %}
        <!-- Google tag (gtag.js) - Deferred for better performance -->
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-3K3SWMLKKN');
        </script>
        <script defer src="https://www.googletagmanager.com/gtag/js?id=G-3K3SWMLKKN"></script>
    </head>
    <body>
        <div class="navbar bg-base-100 shadow-sm sticky top-0 z-50">
            <div class="container mx-auto px-4 flex justify-center md:justify-between items-center">
                <a class="btn btn-ghost normal-case text-xl" href="{% url 'home' %}">MangaFoxy.com</a>
                <div class="hidden md:flex gap-2">
                    <a href="{% url 'updates' %}" class="btn btn-ghost">Updates</a>
                </div>
            </div>
        </div>
        <main class="container mx-auto px-4 sm:px-6 md:px-8 lg:px-12 xl:px-20 py-5">
            {% block content %}
            {% endblock content %}
        </main>
        <footer class="footer sm:footer-horizontal footer-center bg-base-300 text-base-content p-4">
            <aside>
                <p>Copyright © {% now "Y" %} - All right reserved by MANGAFOXY.COM</p>
            </aside>
        </footer>
    </body>
</html>
